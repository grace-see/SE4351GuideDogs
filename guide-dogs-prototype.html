<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guide Dogs — interactive classroom prototype</title>
<style>
:root{color-scheme:dark;--yellow:#ffd400;--red:#ff3b30}*{box-sizing:border-box}body{margin:0;background:#e9e9e7;color:#fff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;min-height:100svh;padding:22px}button,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,select:focus-visible{outline:5px solid #1478ff;outline-offset:3px}.stage{width:414px;transform-origin:top center}.phone{padding:10px;background:#222;border:2px solid #535353;border-radius:48px;box-shadow:0 22px 65px #0003;width:414px}.display{width:390px;height:844px;background:#000;border-radius:36px;overflow:hidden;display:flex;flex-direction:column}.status{height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:8px 25px;font-size:13px;font-weight:700;background:#000;color:#fff}.island{width:96px;height:20px;border-radius:15px;background:#252525}.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;padding:24px;gap:20px;justify-content:center;font-size:32px;font-weight:700;line-height:1.13;overflow:auto}.app h1,.app h2,.app p{margin:0;font-size:inherit}.app h1{font-size:43px;letter-spacing:-1.4px;line-height:1.05}.eyebrow{font-size:32px!important;font-weight:400;color:#fff}.space{flex:1}.action{width:100%;border:0;border-radius:20px;min-height:72px;background:var(--yellow);color:#000;padding:17px 18px;text-align:left;font-size:32px;font-weight:700;line-height:1.12}.secondary{background:#fff}.action:active{transform:scale(.98)}.stack{display:grid;gap:15px}.counter{font-size:96px!important;letter-spacing:-5px;line-height:1;font-variant-numeric:tabular-nums}.arrow{font-size:170px;line-height:1;text-align:center;font-family:Arial,sans-serif}.tap{font-size:32px!important;font-weight:400}.whole{position:absolute;inset:0;z-index:1;border:0;background:transparent;color:transparent;border-radius:20px}.whole:focus-visible{outline-offset:-7px}.content{pointer-events:none;display:flex;flex-direction:column;gap:24px}.brand{color:var(--yellow);font-size:32px}.mic{min-height:320px;flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:25px}.mic svg{width:110px;height:140px}.amber{background:var(--yellow);color:#000}.red{background:var(--red);color:#fff;gap:16px}.red h1,.red p,.red .counter{background:#000;border-radius:12px;padding:8px 12px}.red h1{font-size:39px}.red .counter{font-size:76px!important}.red .action{min-height:65px;padding:12px 16px}.red .stack{gap:10px}.red p{font-size:32px}.presenter{flex-shrink:0;padding:8px 10px;background:#383838;color:#fff;font-size:12px}.presenter .row{display:flex;gap:6px;align-items:center}.presenter button,.presenter select{min-height:32px;border:1px solid #999;background:#f3f3f3;color:#111;border-radius:6px;font-size:13px;padding:4px 7px}.presenter select{min-width:0;flex:1}.presenter .tools{margin-top:6px;justify-content:space-between}.presenter .tools button{min-height:26px;font-size:12px}.caption{color:#454545;text-align:center;font-size:13px;line-height:1.5;margin:15px 0 0}.progress{height:7px;border-radius:5px;background:#343434;overflow:hidden}.progress i{display:block;height:100%;background:var(--yellow);transition:width .3s} @media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{body{padding:0}.caption{display:none}.phone{box-shadow:none}}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="phone"><div class="display"><div class="status" aria-hidden="true"><span>9:41</span><span class="island"></span><span>DEMO</span></div><main class="app" id="app" aria-label="Guide Dogs prototype"></main><nav class="presenter" aria-label="Presenter controls"><div class="row"><button id="back" aria-label="Previous screen">Back</button><select id="jump" aria-label="Jump to any screen"></select><button id="next" aria-label="Next screen">Next</button></div><div class="row tools"><span id="index"></span><button id="replay" aria-label="Repeat spoken screen instructions">Repeat voice</button><button id="sound" aria-label="Mute speech" aria-pressed="false">Sound on</button></div></nav></div></div><p class="caption">CLASSROOM PROTOTYPE · SIMULATED STEPS & CALLS<br>Tap to navigate · Space / Enter activates focused controls<br>Speech and vibration depend on browser support.</p></div>
<script>
'use strict';
const titles=['Welcome','Distance unit','Stride calibration','Vibration practice','Home','Confirm','Route choice','Guidance','Turn','Arrived','Obstacle','Fall check','Who to call','Calling'];
const app=document.querySelector('#app'), jump=document.querySelector('#jump');
const state={screen:0,unit:'Steps',stride:0,remaining:25,cue:0,seconds:30,contact:'UTD Police',muted:false,route:1};
let timers=[],mainLine='',deadline=0;
const cues=[['Stop',[600]],['Turn left',[100,100,100]],['Turn right',[100,100,100,100,100]],['Obstacle',[60,60,60,60,60,60,60]]];
jump.innerHTML=titles.map((t,i)=>`<option value="${i}">${i+1}. ${t}</option>`).join('');
function speak(text){mainLine=text;if(!state.muted&&'speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.94;speechSynthesis.speak(u)}}
function vibrate(pattern){try{if(navigator.vibrate)navigator.vibrate(pattern)}catch(e){}}
function clearTimers(){timers.forEach(clearInterval);timers=[];vibrate(0)}
function action(label,fn,secondary=false){const b=document.createElement('button');b.className='action'+(secondary?' secondary':'');b.textContent=label;b.setAttribute('aria-label',label);b.onclick=fn;return b}
function whole(label,fn){const b=document.createElement('button');b.className='whole';b.setAttribute('aria-label',label);b.onclick=fn;app.append(b)}
function stack(items){const d=document.createElement('div');d.className='stack';items.forEach(([label,fn,secondary])=>d.append(action(label,fn,secondary)));app.append(d)}
function html(markup){app.innerHTML=markup}
function countdown(){const update=()=>{state.seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));const c=document.querySelector('#countdown');if(c)c.textContent=state.seconds;if(state.seconds===0){state.contact='911';go(13,true)}};update();if(state.screen===11||state.screen===12)timers.push(setInterval(update,250))}
function go(n,automatic=false){const previous=state.screen;const focusWasInApp=app.contains(document.activeElement);clearTimers();state.screen=Math.max(0,Math.min(13,n));app.className='app';jump.value=state.screen;document.querySelector('#index').textContent=`${state.screen+1} / 14 · Demo only`;document.querySelector('#back').disabled=state.screen===0;document.querySelector('#next').disabled=state.screen===13;
let line='';switch(state.screen){
case 0:html('<div class="content"><div class="brand">Guide Dogs</div><div class="arrow" aria-hidden="true">↑</div><h1>Welcome to Guide Dogs.</h1><p class="tap">Tap anywhere to begin.</p></div>');line='Welcome to Guide Dogs. Tap anywhere to begin.';whole(line,()=>go(1));break;
case 1:html('<h1>Choose your distance unit.</h1>');stack(['Steps','Feet','Seconds'].map(unit=>[unit,()=>{state.unit=unit;go(2)}]));line='Choose your distance unit. Steps, Feet, or Seconds.';break;
case 2:state.stride=0;html('<div class="content"><div class="brand">Calibrate your stride</div><h1>Walk 10 normal steps, then tap.</h1><p class="counter" id="stride">0 / 10</p><div class="progress" aria-hidden="true"><i id="stridebar" style="width:0%"></i></div><p class="tap">Demo step counter</p></div>');line='Walk 10 normal steps, then tap. This demo simulates the step counter.';whole('Finish stride calibration and continue',()=>go(3));timers.push(setInterval(()=>{state.stride=Math.min(10,state.stride+1);document.querySelector('#stride').textContent=`${state.stride} / 10`;document.querySelector('#stridebar').style.width=state.stride*10+'%';if(state.stride===10){clearTimers();speak('10 steps. Tap anywhere to continue.')}},850));break;
case 3:state.cue=0;html('<div class="content"><div class="brand">Vibration practice</div><h1 id="cuename">Stop</h1><p id="cuepattern">One long buzz</p><p class="tap">Tap to feel the next one.</p><p id="cueindex">1 / 4</p></div>');line='Vibration practice. Stop. One long buzz. Tap to feel the next one.';vibrate(cues[0][1]);whole('Feel the next vibration cue; after four cues, continue to Home',()=>{if(++state.cue>3)return go(4);const names=['One long buzz','Two short buzzes','Three short buzzes','Rapid pulses'];document.querySelector('#cuename').textContent=cues[state.cue][0];document.querySelector('#cuepattern').textContent=names[state.cue];document.querySelector('#cueindex').textContent=`${state.cue+1} / 4`;vibrate(cues[state.cue][1]);speak(cues[state.cue][0]+'. '+names[state.cue]+'. '+(state.cue===3?'Tap to continue.':'Tap to feel the next one.'))});break;
case 4:html('<p class="eyebrow">You are near ECSS 2.402</p>');const mic=action('Tap and say where to go',()=>go(5));mic.classList.add('mic');mic.innerHTML='<svg viewBox="0 0 100 130" fill="none" stroke="currentColor" stroke-width="8" aria-hidden="true"><rect x="33" y="6" width="34" height="70" rx="17" fill="currentColor"/><path d="M18 58v12a32 32 0 0 0 64 0V58M50 103v21M28 124h44"/></svg><span>Tap and say where to go</span>';app.append(mic);line='You are near ECSS 2.402. Tap and say where to go. For this demo, tapping selects ECSS 2.410.';break;
case 5:html('<div class="brand">Your destination</div><h1>Take you to ECSS 2.410?</h1>');stack([['Yes',()=>go(6)],['No',()=>go(4),true]]);line='Take you to ECSS 2.410? Yes or No.';break;
case 6:html('<h1>Choose your route.</h1>');stack([['Route 1: 42 steps, fewest turns',()=>{state.route=1;go(7)}],['Route 2: 36 steps, passes the lounge',()=>{state.route=2;go(7)},true]]);line='Choose your route. Route 1: 42 steps, fewest turns. Route 2: 36 steps, passes the lounge.';break;
case 7:state.remaining=25;html('<div class="content"><div class="brand">To ECSS 2.410</div><div class="arrow" aria-hidden="true">↑</div><h1>Walk 25 steps</h1><p class="counter" id="remaining">25</p><p>steps remaining</p><p class="tap">Demo countdown</p></div>');line='Walk 25 steps. 25 steps remaining. Demo countdown. Tap to advance to the turn.';whole('Advance to the right turn',()=>go(8));timers.push(setInterval(()=>{state.remaining--;document.querySelector('#remaining').textContent=state.remaining;if(state.remaining===0)go(8);else if(state.remaining%5===0)speak(state.remaining+' steps remaining.')},1000));break;
case 8:html('<div class="content"><div class="brand">Next turn</div><h1>Stop.<br>Turn right.</h1><div class="arrow" aria-hidden="true">→</div><p class="tap">Tap to continue.</p></div>');line='Stop. Turn right. Tap to continue.';vibrate([600,600,100,100,100,100,100]);whole(line,()=>go(9));break;
case 9:html('<div class="content"><div class="brand">You have arrived</div><h1>The door to ECSS 2.410 is in front of you.</h1><p class="tap">Tap to return home.</p></div>');line='The door to ECSS 2.410 is in front of you. Tap to return home.';whole(line,()=>go(4));break;
case 10:app.classList.add('amber');html('<div class="content"><h1>Obstacle in 4 steps.</h1><div class="arrow" aria-hidden="true">←</div><h1>Move left.</h1><p class="tap">Tap to resume guidance.</p></div>');line='Obstacle in 4 steps. Move left. Tap to resume guidance.';vibrate(cues[3][1]);whole(line,()=>go(7));break;
case 11:app.classList.add('red');deadline=Date.now()+30000;html('<h1>Are you okay?</h1><p>Say “I’m fine” to cancel.</p><div class="counter" id="countdown" role="timer" aria-label="Seconds until simulated emergency call">30</div>');stack([["I'm fine",()=>go(7)],['Choose who to call',()=>go(12),true]]);line='Are you okay? Say I’m fine to cancel. In this demo, tap I’m fine. 30 seconds until a simulated 911 call and caretaker notification.';vibrate([600]);countdown();break;
case 12:app.classList.add('red');if(previous!==11)deadline=Date.now()+30000;html('<h1>Who to call?</h1><div class="counter" id="countdown" role="timer" aria-label="Seconds until simulated emergency call">30</div><p>No answer: calling 911 and notifying your caretaker.</p>');stack(['Caretaker','UTD Police','911'].map(contact=>[contact,()=>{state.contact=contact;go(13)}]));line='Who to call? Caretaker, UTD Police, or 911. No answer: calling 911 and notifying your caretaker. Demo only.';countdown();break;
case 13:if(previous!==12&&!automatic)state.contact='UTD Police';html(`<div class="content"><div class="brand">Simulated call</div><h1>Calling ${state.contact}.</h1><p>Sending: ECSS 2nd floor, outside room 2.410.</p>${automatic?'<p>Caretaker notified in demo.</p>':''}<p class="tap">Tap to return home.</p></div>`);line=`Demo only. Calling ${state.contact}. Sending: ECSS 2nd floor, outside room 2.410.${automatic?' Caretaker notification simulated.':''} Tap to return home.`;whole(line,()=>go(4));break;
} speak(line);if(document.activeElement===document.body||focusWasInApp)app.querySelector('button')?.focus({preventScroll:true});}
document.querySelector('#back').onclick=()=>go(state.screen-1);document.querySelector('#next').onclick=()=>go(state.screen+1);jump.onchange=()=>go(Number(jump.value));document.querySelector('#replay').onclick=()=>speak(mainLine);document.querySelector('#sound').onclick=()=>{state.muted=!state.muted;const b=document.querySelector('#sound');b.textContent=state.muted?'Sound off':'Sound on';b.setAttribute('aria-label',state.muted?'Enable speech':'Mute speech');b.setAttribute('aria-pressed',state.muted);if(state.muted&&'speechSynthesis'in window)speechSynthesis.cancel();else speak(mainLine)};
function resize(){const scale=Math.min(1,(innerWidth-20)/414);document.querySelector('#stage').style.zoom=scale}addEventListener('resize',resize);resize();go(0);
</script>
</body></html>
